<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172235"><title>Flight Calendar</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172235;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:25px;margin:0}button{border:1px solid #cbd5e1;background:white;border-radius:10px;padding:10px 15px;font-size:15px;cursor:pointer}.sub{color:#64748b;font-size:13px;margin:8px 0 22px}.months{display:flex;gap:8px;align-items:center}.months strong{min-width:170px;text-align:center}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:12px;color:#64748b;padding:8px}.day{background:white;min-height:105px;border:1px solid #e2e8f0;border-radius:9px;padding:7px;overflow:hidden}.day.blank{background:transparent;border:0}.day.today{border-color:#2563eb}.num{font-size:13px;color:#475569;font-weight:600}.flight{background:#e8f1ff;border-left:3px solid #2563eb;border-radius:4px;margin-top:5px;padding:5px;font-size:12px;line-height:1.35}.flight small{display:block;color:#475569}.warning{background:#fff2d6;border-left-color:#c2851b}.foot{margin-top:20px;color:#64748b;font-size:12px}@media(max-width:600px){main{padding:10px}.day{padding:3px;min-height:76px;border-radius:5px}.flight{font-size:10px;padding:3px;overflow-wrap:anywhere}.flight small{font-size:9px}.weekday{font-size:10px;padding:5px}.months strong{min-width:120px}}</style></head><body><main><header><h1>Flight Calendar</h1><div class="months"><button id="prev" aria-label="Previous month">←</button><strong id="month"></strong><button id="next" aria-label="Next month">→</button><button id="today">Today</button></div></header><div class="sub" id="status">Loading flights…</div><div class="calendar" id="calendar"></div><p class="foot">Read-only viewer. Verify booking details with the airline. Updates appear after changes are published to GitHub.</p></main><script>let flights=[],date=new Date();date.setDate(1);const el=id=>document.getElementById(id);function render(){const year=date.getFullYear(),month=date.getMonth();el('month').textContent=date.toLocaleDateString('en-US',{month:'long',year:'numeric'});let out=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>'<div class="weekday">'+d+'</div>').join('');const start=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();for(let i=0;i<start;i++)out+='<div class="day blank"></div>';for(let n=1;n<=days;n++){const key=year+'-'+String(month+1).padStart(2,'0')+'-'+String(n).padStart(2,'0');out+='<div class="day"><div class="num">'+n+'</div>';for(const f of flights.filter(f=>f.date===key)){const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));out+='<div class="flight'+(f.note?' warning':'')+'"><b>'+safe(f.from)+' → '+safe(f.to)+'</b><small>'+safe(f.number)+'</small>'+(f.depart?'<small>'+safe(f.depart)+' '+safe(f.departTZ||'')+'</small>':'')+(f.note?'<small>'+safe(f.note)+'</small>':'')+'</div>'}out+='</div>'}el('calendar').innerHTML=out}el('prev').onclick=()=>{date.setMonth(date.getMonth()-1);render()};el('next').onclick=()=>{date.setMonth(date.getMonth()+1);render()};el('today').onclick=()=>{date=new Date();date.setDate(1);render()};fetch('./flights.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{flights=d.flights;el('status').textContent='Schedule updated: '+d.updated+' · '+flights.length+' flights';render()}).catch(()=>{el('status').textContent='Unable to load flight data. Please refresh.';render()});</script></body></html>
