<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0d0e"><title>Flight Calendar</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d0d0e;color:#f5f5f5}*{box-sizing:border-box}body{margin:0;overflow-x:hidden;touch-action:pan-y}button,.day[data-day]{touch-action:manipulation}main{width:100%;max-width:900px;margin:auto;padding:16px 14px 40px}h1{font-size:24px;font-weight:650;margin:6px 0 8px}.intro{color:#a6a6a9;font-size:13px;margin:0 0 17px}.panel{min-width:0;max-width:100%;overflow:hidden;border:1px solid #333337;border-radius:22px;padding:14px;background:#101011}.nav{min-width:0;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.nav h2{font-size:clamp(15px,5vw,21px);font-weight:650;text-align:center;margin:0;min-width:0;white-space:nowrap}.nav button{flex-shrink:0;border:1px solid #343437;border-radius:30px;background:#111113;color:#d9d9dc;min-width:45px;height:38px;font-size:24px;cursor:pointer}.legend{min-width:0;display:flex;gap:13px;flex-wrap:wrap;font-size:12px;color:#d0d0d0;margin-bottom:15px}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.blue{background:#3269ed}.green{background:#36814e}.purple{background:#842cce}.orange{background:#b65a25}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.week{margin-bottom:5px}.week div{text-align:center;font-size:12px;color:#aaa;padding:5px 0}.day{overflow:hidden;background:#252527;border:1px solid transparent;border-radius:8px;min-height:103px;padding:5px 3px;min-width:0}.day.empty{background:transparent}.day[data-day]{cursor:pointer}.day[data-day]:focus-visible{outline:2px solid #d4d4d8}.day.selected{border-color:#b9b9bc}.day.today{outline:1px solid #777}.date{font-size:13px;color:#bcbcbc;margin:0 0 6px 1px}.flight{min-width:0;display:block;border:0;width:100%;text-align:left;color:#fff;border-radius:5px;padding:6px 4px;margin:4px 0;font-size:11px;line-height:1.25;cursor:pointer;overflow-wrap:anywhere}.flight b{display:block;font-weight:500}.flight small{font-size:10px;display:block}.flight.active{outline:2px solid #f0f0f0;outline-offset:-2px}.flight.blue{background:#2869e7}.flight.green{background:#32804a}.flight.purple{background:#7d25c8}.flight.orange{background:#aa5527}.details{border-top:1px solid #353538;margin-top:17px;padding-top:15px}.detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.detail-head h3{margin:0;font-size:17px}.detail-head button{border:0;background:none;color:#aaa;font-size:25px;cursor:pointer}.flight-card{border-radius:14px;background:#252527;padding:14px;margin-bottom:9px}.flight-card .route{display:flex;justify-content:space-between;gap:8px;font-size:17px;font-weight:650}.flight-card .number{color:#aaa;font-size:13px;font-weight:400}.times{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}.times label{display:block;font-size:11px;color:#aaa;margin-bottom:4px}.times strong{font-size:16px}.extra{border-top:1px solid #444;margin-top:12px;padding-top:9px;font-size:12px;color:#ccc;line-height:1.8}.extra b{color:#fff}.footer{color:#999;font-size:12px;margin-top:15px;text-align:center}.loading{font-size:13px;color:#aaa;margin-bottom:10px}@media(min-width:650px){.day{min-height:125px;padding:7px}.flight{font-size:13px}.flight small{font-size:12px}.date{font-size:16px}.panel{padding:20px}}@media(max-width:420px){main{padding:9px 7px}.panel{padding:10px 7px}.day{min-height:92px;padding:4px 2px}.flight{padding:5px 2px;font-size:10px}.flight small{font-size:9px}.legend{gap:9px}.nav h2{font-size:19px}}
</style></head><body><main><h1>Flight Calendar</h1><p class="intro" id="status">Loading flight schedule…</p><section class="panel"><div class="nav"><button id="prev" aria-label="Previous month">‹</button><h2 id="month"></h2><button id="next" aria-label="Next month">›</button></div><div class="legend"><span><i class="dot blue"></i>To Long Beach</span><span><i class="dot green"></i>To Reno</span><span><i class="dot purple"></i>Other flights</span><span><i class="dot orange"></i>Verify booking</span></div><div class="week"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div class="calendar" id="calendar"></div><section class="details" id="details" hidden></section><div class="footer" id="footer">Tap any day to view all flights</div></section></main>
<script>
let flights=[],date=new Date(),selectedDay=null;date.setDate(1);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const color=f=>f.note?'orange':f.to==='LGB'?'blue':f.to==='RNO'?'green':'purple';
const fmt=t=>{if(!t)return 'Not recorded';const m=/^(\d\d):(\d\d)$/.exec(t);if(!m)return t;const h=+m[1];return (h%12||12)+':'+m[2]+' '+(h>=12?'PM':'AM')};
function showDetails(){const box=$('details');if(!selectedDay){box.hidden=true;return}const dayFlights=flights.filter(f=>f.date===selectedDay);const ds=new Date(selectedDay+'T12:00:00');box.hidden=false;box.innerHTML='<div class="detail-head"><h3>'+esc(ds.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}))+'</h3><button id="close" aria-label="Close details">×</button></div>'+(dayFlights.length?dayFlights.map(f=>'<div class="flight-card"><div class="route"><span>'+esc(f.from)+' → '+esc(f.to)+'</span><span class="number">'+esc(f.number)+'</span></div><div class="times"><div><label>Departure · '+esc(f.from)+'</label><strong>'+esc(fmt(f.depart))+'</strong><div class="number">'+esc(f.departTZ||'')+'</div></div><div><label>Arrival · '+esc(f.to)+'</label><strong>'+esc(fmt(f.arrive))+'</strong><div class="number">'+esc(f.arriveTZ||'')+'</div></div></div>'+(f.seat||f.cabin||f.note?'<div class="extra">'+(f.seat?'<div><b>Seat:</b> '+esc(f.seat)+'</div>':'')+(f.cabin?'<div><b>Cabin:</b> '+esc(f.cabin)+'</div>':'')+(f.note?'<div><b>Note:</b> '+esc(f.note)+'</div>':'')+'</div>':'')+'</div>').join(''):'<p class="intro">No flights scheduled for this day.</p>');$('close').onclick=()=>{selectedDay=null;render()}}
function render(){const y=date.getFullYear(),m=date.getMonth();$('month').textContent=date.toLocaleDateString('en-US',{month:'long',year:'numeric'});const start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let out='';for(let i=0;i<start;i++)out+='<div class="day empty"></div>';for(let n=1;n<=days;n++){const key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0');out+='<div class="day'+(selectedDay===key?' selected':'')+'" data-day="'+key+'" role="button" tabindex="0" aria-label="View all flights for '+key+'"><div class="date">'+n+'</div>';flights.forEach((f,i)=>{if(f.date!==key)return;out+='<button class="flight '+color(f)+'" data-i="'+i+'" aria-label="'+esc(f.from+' to '+f.to+', '+f.number)+'"><b>'+esc(f.to)+'</b><small>'+esc(f.number)+'</small></button>'});out+='</div>'}$('calendar').innerHTML=out;document.querySelectorAll('.day[data-day]').forEach(cell=>{const choose=()=>{selectedDay=cell.dataset.day;render();$('details').scrollIntoView({block:'nearest',behavior:'smooth'})};cell.onclick=choose;cell.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}}});showDetails();const count=flights.filter(f=>f.date.startsWith(y+'-'+String(m+1).padStart(2,'0'))).length;$('footer').textContent=count+' flights this month · Tap a day for all flights'}
$('prev').onclick=()=>{date.setMonth(date.getMonth()-1);selectedDay=null;render()};$('next').onclick=()=>{date.setMonth(date.getMonth()+1);selectedDay=null;render()};
fetch('./flights.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{flights=d.flights||[];$('status').textContent='Schedule updated '+d.updated+' · Times are local to each airport';render()}).catch(()=>{$('status').textContent='Flight data unavailable. Refresh to retry.';render()});
</script></body></html>
